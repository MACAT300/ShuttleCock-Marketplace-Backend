spring.application.name=demo
logging.level.org.springframework=DEBUG
app.image-cache-dir=C:/imagecache
logging.level.org.springframework.security=DEBUG
jwt.secret=${JWT_SECRET}
google.client.id=855982182472-vbbefl4rk42l43ddjtivk952j8mq96ik.apps.googleusercontent.com

## Database Connection
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=Shuttlecock;encrypt=false;trustServerCertificate=true
spring.datasource.username=adminUser
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Payment
stripe.secret.key=${STRIPE_SECRET_KEY}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET}
stripe.success.url=https://yourapp.com/payment-success?session_id={CHECKOUT_SESSION_ID}
stripe.cancel.url=https://yourapp.com/payment-cancel

# User Image
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Optional
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
logging.level.root=DEBUG
